name: Package Extension

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build:beta

      - name: Read extension version
        id: meta
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: pnpm package:extension

      - name: Generate checksum
        run: shasum -a 256 dist/web-recall-${{ steps.meta.outputs.version }}.zip > dist/web-recall-${{ steps.meta.outputs.version }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-recall-${{ steps.meta.outputs.version }}
          path: |
            dist/web-recall-${{ steps.meta.outputs.version }}.zip
            dist/web-recall-${{ steps.meta.outputs.version }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/web-recall-${{ steps.meta.outputs.version }}.zip
            dist/web-recall-${{ steps.meta.outputs.version }}.sha256
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
